<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tongues – learn words in real sentences</title>
<meta name="description" content="Fill the missing word in real sentences – Polish, Welsh, German and Norwegian – with spaced repetition. Works offline.">
<meta name="theme-color" content="#0b0b0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0b0b0a; --card:#15140f; --line:#2c2a26; --fg:#ece8e1; --dim:#8c877f; --sand:#d9b26a; --good:#5fd38a; --bad:#ff7a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 5px; padding: 6px 10px; flex-wrap: nowrap; flex: none; }
  header h1 { font-size: 16px; font-weight: 300; margin: 0 auto 0 0; min-width: 0; letter-spacing: .5px; }
  select, button, input { font: inherit; color: var(--fg); }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; min-height: 40px; max-width: 28vw; font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 0 7px; min-height: 40px; color: var(--dim); font-size: 13px; white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--sand); }
  .statrow { display: flex; align-items: flex-start; flex: none; padding-right: 8px; }
  .statrow .stats { flex: 1; min-width: 0; }
  #gear { margin-top: -4px; margin-bottom: -6px; font-size: 18px; }
  #mListen, #mSpeak { min-width: 40px; }
  .stats { display: flex; gap: 4px 10px; padding: 0 12px 6px; color: var(--dim); font-size: 12px; line-height: 1.3; flex-wrap: wrap; flex: none; }
  .stats b { color: var(--fg); font-weight: 500; }
  .bar { height: 3px; background: var(--line); margin: 0 12px; border-radius: 2px; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; background: var(--sand); width: 0; transition: width .3s; }
  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 6px; max-width: 640px; width: 100%; margin: 0 auto; overflow-y: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .level { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .sent { font-size: 20px; line-height: 1.4; min-height: 2.6em; word-wrap: break-word; flex: none; }
  .gap { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--sand); color: var(--sand); text-align: center; padding: 0 2px; }
  .gap.good { color: var(--good); border-color: var(--good); }
  .gap.bad { color: var(--bad); border-color: var(--bad); }
  .en { color: var(--dim); font-size: 14px; margin-top: 6px; margin-bottom: auto; }
  .en.hidden { filter: blur(6px); cursor: pointer; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .choices button { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 0 6px; min-height: 44px; font-size: 16px; }
  .choices button:active { background: var(--line); }
  .choices button.good { border-color: var(--good); color: var(--good); }
  .choices button.bad { border-color: var(--bad); color: var(--bad); }
  .typing { display: flex; gap: 6px; margin-top: 10px; }
  .typing input { flex: 1; min-width: 0; background: none; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 44px; font-size: 17px; }
  .typing input:focus { outline: none; border-color: var(--sand); }
  .btn { background: var(--sand); color: #111; border: 0; border-radius: 12px; padding: 0 16px; min-height: 44px; font-weight: 600; }
  .ghost { background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-height: 40px; font-size: 13px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .msg { margin-top: 8px; font-size: 14px; min-height: 1.4em; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
  .done .en { margin-bottom: 10px; }
  .done { text-align: center; padding: 16px 8px; justify-content: center; }
  .done h2 { font-weight: 300; margin: 0 0 6px; font-size: 20px; }
  footer { color: var(--dim); font-size: 11px; line-height: 1.3; text-align: center; padding: 4px 12px 6px; flex: none; }
  footer a { color: var(--dim); }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex: none; }
  .actions .btn { flex: 1; }
  .sayb { background: none; color: var(--sand); border: 1px solid var(--sand); border-radius: 12px; padding: 0 14px; min-height: 44px; font-weight: 600; white-space: nowrap; }
  .sayb.big { flex: 1; background: var(--card); }
  .sayb.live { background: var(--sand); color: #111; }
  .speakbox { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .speakbox:empty { display: none; }
  .speakbox .score { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .speakbox .score small { font-weight: 400; color: var(--dim); font-size: 12px; }
  .speakbox .tw { font-size: 17px; line-height: 1.35; color: var(--fg); }
  .tw .ok { color: var(--good); } .tw .near { color: #f0b84a; } .tw .miss { color: var(--bad); text-decoration: underline dotted; }
  .speakbox .said { margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .speakbox .err { color: var(--bad); }
  .speaking .choices, .speaking .typing, .speaking .keys { display: none; }
  .keys { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .ic { min-width: 40px; padding: 0 6px; font-size: 16px; }
  .ghost.on { color: var(--sand); border-color: var(--sand); }
  .ghost.off { text-decoration: line-through; }
  .badge { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; font-size: 10px; line-height: 1.5; color: var(--sand); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 640px; max-height: 80vh; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px 14px; }
  .sheet h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .sheet h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -10px; background: var(--card); padding: 2px 0 4px; }
  .sheet p { margin: 4px 0; font-size: 14px; }
  .sheet .dim { color: var(--dim); font-size: 12px; }
  .sheet mark { background: none; color: var(--sand); border-bottom: 2px solid var(--sand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; min-height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--fg); font-size: 15px; text-decoration: none; }
  .chip.on, .chip.ans { border-color: var(--sand); color: var(--sand); }
  .aibox { font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .aibox.err { color: var(--bad); }
  .sheet input.f, .sheet select.f { width: 100%; max-width: none; min-height: 40px; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; margin-top: 6px; font-size: 14px; }
  .sheet select.f { background: var(--card); }
  #toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); background: #26241d; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; z-index: 30; max-width: 90vw; pointer-events: none; }
  @media (max-width: 400px) { .seg .lbl { display: none; } .seg button { min-width: 40px; } }
  @media (max-width: 380px) { .sent { font-size: 18px; } .choices button { font-size: 15px; } header h1 { font-size: 15px; } }
</style>
</head>
<body>
<header>
  <h1>Tongues</h1>
  <select id="lang" aria-label="Language">
    <option value="pol">Polish</option><option value="cym">Welsh</option><option value="deu">German</option><option value="nob">Norwegian</option>
  </select>
  <span class="seg" role="group" aria-label="Answer by">
    <button id="mChoice" type="button">Choice</button><button id="mType" type="button">Type</button><button id="mSpeak" type="button" title="Speak mode: say the whole sentence and get scored" aria-label="Speak mode" hidden>🎤</button>
  </span>
  <span class="seg"><button id="mListen" type="button" title="Hear the sentence before you answer" aria-label="Listen mode">🔊<span class="lbl"> Listen</span></button></span>
</header>
<div class="statrow"><div class="stats" id="stats"></div><button id="gear" class="ghost ic" type="button" title="Settings: filters, level, favourites, AI" aria-label="Settings">⚙</button></div>
<div class="bar"><i id="prog"></i></div>
<main id="main"><div class="card"><div class="sent">Loading…</div></div></main>
<footer>Sentences from <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> (CC-BY 2.0 FR)<span id="srcLink"></span> · progress is kept on this device</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const DAY = 864e5, ROUND = 10;
/* Mastery steps as in Clozemaster: 0 → 25 → 50 → 75 → 100 %, seen again after these gaps. */
const STEP_GAP = [0, 1, 10, 30, 180].map(d => d * DAY);
const LS = { get(k, d) { try { const v = localStorage.getItem("cloze." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem("cloze." + k, JSON.stringify(v)); } catch {} } };
const cfg = Object.assign({ lang: "pol", mode: "choice", listen: false, showEn: true }, LS.get("cfg", {}));
const prog = LS.get("progress", {});      // { lang: { c: { id: [level, due] }, n: nextNewIndex } }
const days = LS.get("days", {});          // { "2026-10-31": points }
const decks = {};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micDenied = false, spoken = false, bestNow = null;
let deck = null, queue = [], round = [], pos = 0, roundRight = 0, card = null, answered = false;

const today = () => new Date().toISOString().slice(0, 10);
function streak() {
  let s = 0, d = new Date();
  if (!days[today()]) d.setDate(d.getDate() - 1);   // today not started yet doesn't break the streak
  while (days[d.toISOString().slice(0, 10)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
const P = () => (prog[cfg.lang] ||= { c: {}, n: 0 });

/* Letters a learner may leave off: Polish ą ć ę ł ń ó ś ź ż, Welsh â ŵ ŷ…, German ä ö ü ß, Norwegian æ ø å. */
function plain(s) {
  return s.toLowerCase().replace(/ł/g, "l").replace(/ß/g, "ss").replace(/æ/g, "ae").replace(/ø/g, "o")
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").trim();
}
/* Which letters were wrong only by their accent, e.g. "ł, ę". */
function accentHint(typed, want) {
  const t = typed.trim().toLowerCase(), w = want.toLowerCase(), out = [];
  for (let i = 0; i < w.length; i++) if (t[i] !== w[i] && plain(w[i]) === plain(t[i] || "")) out.push(w[i]);
  return [...new Set(out)].join(", ");
}

/* ---- Speaking score: word-by-word alignment of what was said against the target sentence ---- */
function sWords(s) { return String(s).normalize("NFC").toLowerCase().replace(/[’‘`]/g, "'").replace(/[^\p{L}\p{N}']+/gu, " ").replace(/'/g, "").trim().split(/\s+/).filter(Boolean); }
function lev(a, b) {
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
/* 1 = exact, 0.5 = close (same without accents, or one letter off in a word of 5+ letters), 0 = no match */
function wordGrade(t, s) {
  if (t === s) return 1;
  const pt = plain(t), ps = plain(s);
  if (pt === ps) return 0.5;
  if (pt.length >= 5 && lev(pt, ps) <= 1) return 0.5;
  return 0;
}
function scoreSpeech(target, said) {
  const T = sWords(target), S = sWords(said), n = T.length, m = S.length;
  const g = T.map(t => S.map(s => wordGrade(t, s)));
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1], g[i - 1][j - 1] > 0 ? dp[i - 1][j - 1] + g[i - 1][j - 1] : 0);
  const marks = new Array(n).fill(0);
  for (let i = n, j = m; i > 0 && j > 0;) {
    if (g[i - 1][j - 1] > 0 && dp[i][j] === dp[i - 1][j - 1] + g[i - 1][j - 1]) { marks[i - 1] = g[i - 1][j - 1]; i--; j--; }
    else if (dp[i][j] === dp[i - 1][j]) i--; else j--;
  }
  const total = marks.reduce((a, b) => a + b, 0);
  return { score: n ? Math.round(100 * total / n) : 0, words: T, marks, said: S.join(" ") };
}
const speakLabel = sc => sc >= 90 ? "Excellent!" : sc >= 70 ? "Good!" : "Try again";
/* ---- end speaking score ---- */

async function loadDeck(code) {
  if (decks[code]) return decks[code];
  const r = await fetch("data/" + code + ".json");
  const d = await r.json();
  // words indexed by rank, for picking believable wrong answers
  d.rankOf = new Map(d.words.map((w, i) => [w, i]));
  migrate(code, d);
  buildLevels(d);
  return (decks[code] = d);
}

/* A rebuilt deck lists the old deck's sentence ids; progress on sentences that are still in it moves across. */
function migrate(code, d) {
  const p = prog[code];
  if (!p) { if (d.v) prog[code] = { c: {}, n: 0, v: d.v }; return; }
  if (!d.v || p.v === d.v) return;
  if (d.old) {
    const at = new Map(d.items.map((it, i) => [it[5], i]));
    const move = o => { const n = {}; for (const [k, v] of Object.entries(o || {})) { const j = at.get(d.old[k]); if (j != null) n[j] = v; } return n; };
    p.c = move(p.c); if (p.k) p.k = move(p.k); if (p.f) p.f = move(p.f);
  } else { p.c = {}; delete p.k; delete p.f; }
  p.n = 0; p.v = d.v;
  LS.set("progress", prog);
}

/* Due reviews first (oldest due first), then new cards in deck order (easy → hard). */
const F = () => ((cfg.f ||= {})[cfg.lang] ||= { lvl: "all", up: true, fav: false });
const filtered = () => F().fav || F().lvl !== "all";
function eligible(i) {   // not known, and passes the favourites / level filters
  const p = P(), f = F();
  if (p.k && p.k[i]) return false;
  if (f.fav && !(p.f && p.f[i])) return false;
  if (f.lvl !== "all") { const L = LEVELS.indexOf(f.lvl), l = deck.lv[i]; if (f.up ? l > L : l !== L) return false; }
  return true;
}
function buildQueue() {
  const p = P(), now = Date.now(), f = F();
  if (f.fav) {   // starred cards only: due and new first, then the rest by soonest due
    return Object.keys(p.f || {}).map(Number).filter(eligible).sort((a, b) => ((p.c[a] || [0, 0])[1]) - ((p.c[b] || [0, 0])[1]));
  }
  const due = Object.entries(p.c).filter(([id, v]) => v[1] <= now && eligible(+id))
    .sort((a, b) => a[1][1] - b[1][1]).map(([id]) => +id);
  const fresh = [];
  for (let i = filtered() ? 0 : p.n; i < deck.items.length && fresh.length < ROUND; i++) if (!(i in p.c) && eligible(i)) fresh.push(i);
  return due.concat(fresh);
}

/* Known cards count as mastered and seen, and are never due. */
function tally(p) {
  const now = Date.now(), k = p.k || {}; let due = 0, mastered = Object.keys(k).length, seen = mastered;
  for (const [id, v] of Object.entries(p.c)) { if (k[id]) continue; seen++; if (v[0] >= 4) mastered++; if (v[1] <= now) due++; }
  return { due, mastered, seen };
}
function counts() { return Object.assign(tally(P()), { total: deck ? deck.items.length : 0 }); }

/* ---- CEFR-style level estimate per sentence, from the deck's own word frequencies ---- */
const LEVELS = ["A1", "A2", "B1", "B2", "C1"], LV_CUT = [.15, .35, .6, .85];   // share of each deck: 15/20/25/25/15 %
const WORD_RE = /[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*/gu;
const tokens = s => (String(s).normalize("NFC").toLowerCase().replace(/[’‘`]/g, "'").match(WORD_RE)) || [];
/* Difficulty = rank of the sentence's rarest word (rank 1 = commonest; equally-rare words share a rank)
   + half the average word rank + length. Sentences are then cut into the five bands by difficulty. */
function buildLevels(d) {
  const T = d.items.map(it => tokens(it[0])), cnt = new Map();
  T.forEach(t => t.forEach(w => cnt.set(w, (cnt.get(w) || 0) + 1)));
  const first = new Map();
  [...cnt.values()].sort((a, b) => b - a).forEach((c, i) => first.has(c) || first.set(c, i + 1));
  const sc = T.map(t => {
    if (!t.length) return 0;
    const ls = t.map(w => Math.log(first.get(cnt.get(w))));
    return Math.max(...ls) + .5 * ls.reduce((a, b) => a + b, 0) / ls.length + .12 * t.length;
  });
  const order = sc.map((_, i) => i).sort((a, b) => sc[a] - sc[b] || a - b);
  d.lv = new Uint8Array(sc.length);
  order.forEach((i, k) => { const f = k / order.length; d.lv[i] = f < LV_CUT[0] ? 0 : f < LV_CUT[1] ? 1 : f < LV_CUT[2] ? 2 : f < LV_CUT[3] ? 3 : 4; });
  // spelling to look words up under: capitalised only if it usually is in mid-sentence (German nouns, names)
  const cap = new Map(), low = new Map();
  for (const it of d.items) for (const m of it[0].matchAll(WORD_RE)) {
    if (!m.index) continue;
    const lw = m[0].toLowerCase(); (m[0][0] !== lw[0] ? cap : low).set(lw, ((m[0][0] !== lw[0] ? cap : low).get(lw) || 0) + 1);
  }
  d.form = (w, atStart) => { const lw = w.toLowerCase(); return (cap.get(lw) || 0) > (low.get(lw) || 0) ? lw[0].toUpperCase() + lw.slice(1) : atStart ? lw : w; };
}
/* User's level: the highest band where they know (right twice in a row, or marked known) ≥60% of at least 5 cards seen there. */
function estLevel(p, d) {
  const seen = [0, 0, 0, 0, 0], got = [0, 0, 0, 0, 0], k = p.k || {};
  for (const id of new Set([...Object.keys(p.c), ...Object.keys(k)])) {
    const l = d.lv[id]; if (l == null) continue;
    seen[l]++; if (k[id] || (p.c[id] && p.c[id][0] >= 2)) got[l]++;
  }
  let r = null; for (let l = 0; l < 5; l++) if (seen[l] >= 5 && got[l] / seen[l] >= .6) r = LEVELS[l];
  return r;
}

function speakAvg() { const v = Object.values(P().s || {}); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; }

function lvNow() {
  const p = P(); if (!deck) return p.lv || null;
  const l = estLevel(p, deck);
  if ((p.lv || null) !== l) { p.lv = l; LS.set("progress", prog); }
  return l;
}
function renderStats() {
  const c = counts();
  $("stats").innerHTML = `<span>🔥 <b>${streak()}</b> day streak</span><span>today <b>${days[today()] || 0}</b> pts</span>` +
    `<span><b>${c.due}</b> to review</span><span><b>${c.mastered}</b> mastered · ${c.seen}/${c.total} seen</span>` +
    (lvNow() ? `<span>Level ≈ <b>${lvNow()}</b></span>` : "") +
    (speakAvg() != null ? `<span>🎤 <b>${speakAvg()}%</b> avg</span>` : "");
  LS.set("summary", summary());
}

/* For Dune's Learn hub: a quick look at progress in every language (no deck loading needed). */
function summary() {
  const out = { streak: streak(), today: days[today()] || 0, langs: {} };
  for (const [code, p] of Object.entries(prog)) {
    const { due, mastered, seen } = tally(p);
    const sv = Object.values(p.s || {});
    out.langs[code] = { due, mastered, seen, speakAvg: sv.length ? Math.round(sv.reduce((a, b) => a + b, 0) / sv.length) : null, speakN: sv.length, level: p.lv || null };
  }
  const all = Object.values(out.langs).reduce((a, l) => (a.n += l.speakN, a.t += (l.speakAvg || 0) * l.speakN, a), { n: 0, t: 0 });
  out.speakAvg = all.n ? Math.round(all.t / all.n) : null; out.speakN = all.n;
  return out;
}
window.clozeStats = () => JSON.stringify(summary());

function speak(text, rate = 0.92) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = deck.voice; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(deck.voice.slice(0, 2)));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}

/* Three wrong answers that look plausible: words of similar commonness and length. */
function distractors(word) {
  const lw = word.toLowerCase(), r = deck.rankOf.get(lw) ?? deck.words.length / 2, pool = [];
  for (let span = 60; pool.length < 3 && span < 4000; span *= 2) {
    pool.length = 0;
    for (let i = Math.max(0, r - span); i < Math.min(deck.words.length, r + span); i++) {
      const w = deck.words[i];
      if (w !== lw && Math.abs(w.length - lw.length) <= 3 && plain(w) !== plain(lw)) pool.push(w);
    }
  }
  const pick = [];
  while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  const cap = word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase();
  return pick.map(w => cap ? w[0].toUpperCase() + w.slice(1) : w);
}

function startRound() {
  queue = buildQueue();
  round = queue.slice(0, ROUND); pos = 0; roundRight = 0;
  if (!round.length) return renderDone(true);
  next();
}

function next() {
  answered = false;
  while (pos < round.length && P().k && P().k[round[pos]]) pos++;   // known meanwhile (e.g. a retry of a card marked known)
  if (pos >= round.length) return renderDone(false);
  card = round[pos];
  const [sent, en, start, word] = deck.items[card];
  const level = (P().c[card] || [0])[0];
  $("prog").style.width = (pos / round.length * 100) + "%";
  const before = esc(sent.slice(0, start)), after = esc(sent.slice(start + word.length));
  let body = `<div class="card">
    <div class="level"><span>${level ? "Review · " + level * 25 + "% mastered" : "New"}<span class="badge" id="lvbadge" title="Estimated level (CEFR)">${LEVELS[deck.lv[card]]}</span></span><span>${pos + 1} / ${round.length}</span></div>
    <div class="sent">${cfg.mode === "speak" ? esc(sent) : before + '<span class="gap" id="gap">' + "&nbsp;".repeat(Math.max(4, word.length)) + "</span>" + after}</div>
    <div class="en ${cfg.showEn ? "" : "hidden"}" id="en" title="Tap to show">${esc(en)}</div>`;
  if (cfg.mode === "speak") {
    // no gap-filling: hear/see the sentence, say it, get scored
  } else if (cfg.mode === "choice") {
    const opts = shuffle([word, ...distractors(word)]);
    body += `<div class="choices">${opts.map((o, i) => `<button type="button" data-w="${esc(o)}">${i + 1}. ${esc(o)}</button>`).join("")}</div>`;
  } else {
    body += `<div class="typing"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Missing word"><button class="btn" id="check" type="button">Check</button></div>`;
  }
  body += `<div class="speakbox" id="speakbox" aria-live="polite"></div><div class="msg" id="msg"></div>${cfg.mode === "speak" ? '<div class="actions" id="actions"></div>' : ""}<div class="row" id="brow">
    <button class="ghost ic" id="say" type="button" title="Hear it" aria-label="Hear it">🔊</button>
    <button class="ghost ic" id="slow" type="button" title="Hear it slowly" aria-label="Hear it slowly">🐢</button>
    <button class="ghost ic" id="fav" type="button"></button>
    <button class="ghost ic" id="known" type="button"></button>
    <button class="ghost" id="hint" type="button">${cfg.mode === "speak" ? "Explain" : cfg.mode === "type" ? "Hint" : "Skip"}</button>
    <button class="ghost ic ${cfg.showEn ? "" : "off"}" id="toggleEn" type="button" title="Show / hide English" aria-label="Show or hide English">EN</button></div>
    ${cfg.mode === "choice" ? '<div class="keys">Keys: 1–4 to answer, Enter for next</div>' : ""}</div>`;
  $("main").innerHTML = body;
  $("en").onclick = () => $("en").classList.remove("hidden");
  $("toggleEn").onclick = () => { cfg.showEn = !cfg.showEn; LS.set("cfg", cfg); $("en").classList.toggle("hidden", !cfg.showEn); $("toggleEn").classList.toggle("off", !cfg.showEn); };
  $("say").onclick = () => speak(sent);
  $("slow").onclick = () => speak(sent, 0.6);
  $("fav").onclick = toggleFav; $("known").onclick = toggleKnown; paintMarks();
  stopRec(); spoken = false; bestNow = null;
  if (cfg.mode === "speak") {
    $("hint").onclick = openExplain;
    $("msg").remove(); renderActions(true);
  } else if (cfg.mode === "choice") {
    document.querySelectorAll(".choices button").forEach(b => b.onclick = () => answer(b.dataset.w, b));
    $("hint").onclick = () => answer("", null);
  } else {
    const inp = $("answer");
    inp.focus();
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); answered ? (pos++, next()) : answer(inp.value, null); } };
    $("check").onclick = () => answered ? (pos++, next()) : answer(inp.value, null);
    $("hint").onclick = () => { inp.value = word.slice(0, Math.min(word.length - 1, inp.value.length + 1)); inp.focus(); };
  }
  if (cfg.listen) speak(sent);
}

function answer(given, btn) {
  if (answered) return;
  answered = true;
  const [sent, , , word] = deck.items[card];
  const exact = given.trim().toLowerCase() === word.toLowerCase();
  const right = exact || (cfg.mode === "type" && given.trim() && plain(given) === plain(word));
  const gap = $("gap"); gap.textContent = word; gap.classList.add(right ? "good" : "bad");
  const msg = $("msg");
  if (right) {
    msg.className = "msg good";
    msg.textContent = exact ? "✓ Right" : "✓ Right – watch the letters: " + accentHint(given, word);
  } else {
    msg.className = "msg bad";
    msg.textContent = given.trim() ? "✗ It's “" + word + "”" + (cfg.mode === "type" ? " (you wrote “" + given.trim() + "”)" : "") : "The word is “" + word + "”";
  }
  if (btn) btn.classList.add(right ? "good" : "bad");
  document.querySelectorAll(".choices button").forEach(b => { if (b.dataset.w === word) b.classList.add("good"); b.disabled = true; });
  // Spaced repetition: right → next mastery step and a longer gap; wrong → back to the start, seen again this round.
  const p = P(), cur = p.c[card] || [0, 0];
  if (right) {
    const lvl = Math.min(4, cur[0] + 1);
    p.c[card] = [lvl, Date.now() + STEP_GAP[lvl]];
    const pts = (cfg.mode === "type" ? 8 : 4) + (cfg.listen ? 2 : 0);
    days[today()] = (days[today()] || 0) + pts;
    roundRight++;
  } else {
    p.c[card] = [0, Date.now()];
    if (round.length < ROUND * 2) round.push(card);   // try it again before the round ends
  }
  if (card >= p.n) { while (p.n in p.c) p.n++; }
  LS.set("progress", prog); LS.set("days", days);
  speak(sent);
  renderStats();
  afterAnswer();
}
function afterAnswer() {
  const ac = document.createElement("div"); ac.className = "actions"; ac.id = "actions"; $("msg").after(ac);
  renderActions(false);
  if (cfg.mode === "type") $("check").textContent = "Next";
  const h = $("hint"); if (h) { h.textContent = "Explain"; h.onclick = openExplain; }
  $("srcLink").innerHTML = ` · <a href="https://tatoeba.org/sentences/show/${deck.items[card][5]}" target="_blank" rel="noopener">this sentence</a>`;
}
/* Show the answer without marking it right or wrong (used when a card is marked known before answering). */
function reveal() {
  answered = true;
  const word = deck.items[card][3], g = $("gap"); g.textContent = word; g.classList.add("good");
  document.querySelectorAll(".choices button").forEach(b => { if (b.dataset.w === word) b.classList.add("good"); b.disabled = true; });
  const inp = $("answer"); if (inp) inp.value = word;
  afterAnswer();
}

/* ---- favourites and known ---- */
let toastT = 0;
function toast(t) {
  let e = $("toast"); if (!e) { e = document.createElement("div"); e.id = "toast"; e.setAttribute("role", "status"); document.body.appendChild(e); }
  e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 2600);
}
function paintMarks() {
  const p = P(), f = !!(p.f && p.f[card]), k = !!(p.k && p.k[card]);
  const fb = $("fav"), kb = $("known"); if (!fb) return;
  fb.textContent = f ? "★" : "☆"; fb.classList.toggle("on", f);
  fb.title = f ? "Remove from favourites" : "Add to favourites"; fb.setAttribute("aria-label", fb.title);
  kb.textContent = k ? "↩" : "✓"; kb.classList.toggle("on", k);
  kb.title = k ? "Undo: not known" : "Known: don't show this card again"; kb.setAttribute("aria-label", kb.title);
}
function toggleFav() {
  const p = P(); p.f ||= {};
  if (p.f[card]) { delete p.f[card]; toast("Removed from favourites"); } else { p.f[card] = 1; toast("★ Added to favourites"); }
  LS.set("progress", prog); paintMarks();
}
function toggleKnown() {
  const p = P(); p.k ||= {};
  if (p.k[card]) { delete p.k[card]; toast("Undone – this card will come back"); }
  else {
    p.k[card] = 1; toast("✓ Known – won't be asked again. Tap ↩ to undo");
    if (!answered && cfg.mode !== "speak") reveal();
  }
  LS.set("progress", prog); paintMarks(); renderStats();
}

function closeSheet() { const b = $("sheetbg"); if (b) b.remove(); const f = sheetClose; sheetClose = null; if (f) f(); }

const WIKI = { pol: "Polish", cym: "Welsh", deu: "German", nob: "Norwegian_Bokmål" };
const AI_DEF = { openrouter: { url: "https://openrouter.ai/api/v1/chat/completions", model: "openai/gpt-5.4-mini", name: "OpenRouter" },
                 openai: { url: "https://api.openai.com/v1/chat/completions", model: "gpt-5.4-mini", name: "OpenAI" } };
const AI = () => Object.assign({ provider: "openrouter", key: "", model: "" }, LS.get("ai", {}));
const fmtAI = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

function openExplain() {
  const [sent, en, start, word, , tid] = deck.items[card], lang = cfg.lang, myCard = card;
  let chips = "";
  for (const m of sent.matchAll(WORD_RE)) {
    const href = "https://en.wiktionary.org/wiki/" + encodeURIComponent(deck.form(m[0], m.index === 0)) + "#" + WIKI[lang];
    chips += `<a class="chip${m.index === start ? " ans" : ""}" href="${href}" target="_blank" rel="noopener">${esc(m[0])}</a>`;
  }
  const ai = AI();
  openSheet("Explain", `<p style="font-size:18px;line-height:1.4">${esc(sent.slice(0, start))}<mark>${esc(word)}</mark>${esc(sent.slice(start + word.length))}</p>
    <p style="color:var(--dim)">${esc(en)}</p>
    <h4>Look up a word (Wiktionary)</h4><div class="chips" id="wchips">${chips}</div>
    <h4>AI explanation</h4><div class="aibox" id="aibox"></div>`);
  const box = $("aibox"), ask = (force) => {
    const ck = lang + ":" + tid, cache = LS.get("explain", {});
    if (!ai.key) { box.innerHTML = `<span class="dim">Add an API key in <a href="#" id="toset" style="color:var(--sand)">⚙ settings</a> for a short AI explanation. The key stays on this device.</span>`; $("toset").onclick = e => { e.preventDefault(); openSettings(); }; return; }
    if (cache[ck] && !force) { box.innerHTML = fmtAI(cache[ck]); return; }
    box.textContent = "Asking " + AI_DEF[ai.provider].name + "…";
    aiExplain(sent, en, word, lang, ai).then(t => {
      const c = LS.get("explain", {}); c[ck] = t; const ks = Object.keys(c); if (ks.length > 300) delete c[ks[0]]; LS.set("explain", c);
      if ($("aibox") === box) box.innerHTML = fmtAI(t);
    }).catch(e => { if ($("aibox") === box) { box.className = "aibox err"; box.textContent = "Couldn't get an explanation: " + (e.message || e).toString().slice(0, 140); } });
  };
  ask(false);
}
async function aiExplain(sent, en, word, lang, ai) {
  const d = AI_DEF[ai.provider] || AI_DEF.openrouter, name = deck.name;
  const prompt = `${name} sentence: "${sent}"\nEnglish: "${en}"\nThe learner had to fill in the word: "${word}".\n\nExplain for a learner in at most 120 words, in plain text: (1) what the sentence means, (2) why the missing word takes this form (case, tense, agreement${lang === "cym" ? ", mutation" : ""}), (3) one similar example sentence with its English translation.`;
  const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + ai.key };
  if (ai.provider === "openrouter") { headers["X-Title"] = "Tongues"; }
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(d.url, { method: "POST", headers, signal: ctl.signal, body: JSON.stringify({ model: ai.model.trim() || d.model,
      messages: [{ role: "system", content: "You are a concise, friendly language tutor. Never exceed 120 words." }, { role: "user", content: prompt }] }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status + " " + ((j.error && (j.error.message || j.error)) || r.statusText || "request failed"));
    const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!t) throw new Error("empty reply");
    return String(t).trim();
  } catch (e) { throw e.name === "AbortError" ? new Error("timed out") : e; }
  finally { clearTimeout(to); }
}

  sh.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { f.lvl = b.dataset.l; save(); });
  sh.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { f.up = b.dataset.up === "1"; save(); });
  $("clrk").onclick = () => { P().k = {}; LS.set("progress", prog); $("nk").textContent = "0 known"; dirty = true; renderStats(); };
  $("aip").value = ai.provider; $("aik").value = ai.key; $("aim").value = ai.model;
  const aiSave = () => { const m = $("aim"); m.placeholder = "Model (default " + AI_DEF[$("aip").value].model + ")"; LS.set("ai", { provider: $("aip").value, key: $("aik").value.trim(), model: m.value.trim() }); };
  $("aip").onchange = $("aik").oninput = $("aim").oninput = aiSave; aiSave();
  paint();
}

/* ---- Say it: speech recognition ---- */
function stopRec() { if (rec) { const r = rec; rec = null; r.onresult = r.onerror = r.onend = null; try { r.abort ? r.abort() : r.stop(); } catch {} } }

function renderActions(speakMode) {
  const ac = $("actions"); ac.innerHTML = "";
  if (SR && !micDenied) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "sayit"; b.className = "sayb" + (speakMode ? " big" : ""); b.textContent = "🎤 Say it";
    b.onclick = () => rec ? stopRec2() : startSay();
    ac.appendChild(b);
  } else if (speakMode) {
    $("speakbox").innerHTML = `<span class="err">${SR ? "Microphone permission was denied – allow it in the browser or app settings." : "Speech recognition isn't available in this browser."}</span>`;
  }
  const nx = document.createElement("button");
  nx.className = "btn"; nx.type = "button"; nx.textContent = "Next →"; nx.id = "next";
  nx.onclick = () => { pos++; next(); };
  ac.appendChild(nx);
}
function stopRec2() { try { rec && rec.stop(); } catch {} }

function startSay() {
  if (!SR || rec) return;
  try { speechSynthesis.cancel(); } catch {}
  const [sent] = deck.items[card], box = $("speakbox"), btn = $("sayit"), myCard = card;
  let got = false, failed = false;
  const r = rec = new SR();
  try { r.lang = deck.voice; r.interimResults = false; r.continuous = false; r.maxAlternatives = 3; } catch {}
  const fail = t => { failed = true; box.innerHTML = `<span class="err">${t}</span>`; };
  r.onresult = ev => {
    got = true;
    const res = Array.from(ev.results || []).filter(x => x && x.length);
    let best = null;
    for (let k = 0; k < 3; k++) {
      if (!res.some(x => x.length > k)) break;
      const said = res.map(x => x[Math.min(k, x.length - 1)].transcript).join(" ");
      const sc = scoreSpeech(sent, said);
      if (!best || sc.score > best.score) best = sc;
    }
    if (best && card === myCard) showScore(best);
  };
  r.onerror = ev => {
    const e = ev && ev.error;
    if (e === "aborted") return;
    if (e === "not-allowed" || e === "service-not-allowed") { micDenied = true; fail("Microphone permission was denied – allow it in the browser or app settings."); }
    else if (e === "no-speech") fail("Didn't hear anything – tap Try again and speak up.");
    else if (e === "network") fail("Speech recognition needs an internet connection.");
    else if (e === "audio-capture") fail("No microphone found.");
    else fail("Couldn't listen (" + (e || "unknown") + ").");
  };
  r.onend = () => {
    if (rec === r) rec = null;
    if (!got && !failed) fail("Didn't catch that – try again.");
    if (micDenied) { $("sayit")?.remove(); return; }
    const b = $("sayit"); if (b) { b.classList.remove("live"); b.textContent = got ? "↻ Try again" : "🎤 Try again"; }
  };
  try { r.start(); } catch { rec = null; fail("Couldn't start the microphone."); return; }
  btn.classList.add("live"); btn.textContent = "● Listening… tap to stop";
  box.innerHTML = "";
  document.querySelector(".card")?.classList.add("speaking");
}

function showScore(res) {
  const p = P(); p.s ||= {};
  const prev = p.s[card];
  if (bestNow == null || res.score > bestNow) bestNow = res.score;
  if (prev == null || res.score > prev) { p.s[card] = res.score; LS.set("progress", prog); }
  if (!spoken && res.score >= 70) {
    spoken = true; days[today()] = (days[today()] || 0) + 3; LS.set("days", days);
    if (cfg.mode === "speak") roundRight++;
  }
  const best = p.s[card];
  const html = res.words.map((w, i) => `<span class="${res.marks[i] === 1 ? "ok" : res.marks[i] > 0 ? "near" : "miss"}">${esc(w)}</span>`).join(" ");
  $("speakbox").innerHTML = `<div class="score" id="score">${res.score}% · ${speakLabel(res.score)} <small>best ${best}%</small></div>` +
    `<div class="tw" id="tw">${html}</div><div class="said" id="said">You said: ${esc(res.said || "…")}</div>`;
  renderStats();
}

function renderDone(empty) {
  $("prog").style.width = "100%";
  const c = counts(), f = F();
  const why = !empty ? "" : f.fav && !Object.keys(P().f || {}).filter(eligible).length ? "No starred cards yet – tap ☆ on a card to add it, or switch the filter off in ⚙."
    : filtered() ? "Nothing to practise with the current filter (⚙). Try another level or turn it off." : "Nothing to review in " + deck.name + " right now, and no new sentences left.";
  $("main").innerHTML = `<div class="card done">
    <h2>${empty ? (filtered() ? "Nothing here" : "All caught up") : "Round done: " + roundRight + " of " + round.length}</h2>
    <p class="en">${empty ? why : c.due + " to review · " + c.mastered + " mastered"}</p>
    <button class="btn" id="again" type="button">${empty ? (filtered() ? "Change filter" : "Back") : "Another round"}</button></div>`;
  $("again").onclick = empty && filtered() ? openSettings : startRound;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

document.addEventListener("keydown", e => {
  if (cfg.mode !== "choice" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || $("sheetbg")) return;
  if (!answered && /^[1-4]$/.test(e.key)) document.querySelectorAll(".choices button")[+e.key - 1]?.click();
  else if (answered && e.key === "Enter") $("next")?.click();
});

function setMode(m) { cfg.mode = m; LS.set("cfg", cfg); $("mChoice").classList.toggle("on", m === "choice"); $("mType").classList.toggle("on", m === "type"); $("mSpeak").classList.toggle("on", m === "speak"); if (deck) next(); }
$("mSpeak").onclick = () => setMode("speak");
$("mChoice").onclick = () => setMode("choice");
$("mType").onclick = () => setMode("type");
$("gear").onclick = () => deck && openSettings();
$("mListen").onclick = () => { cfg.listen = !cfg.listen; LS.set("cfg", cfg); $("mListen").classList.toggle("on", cfg.listen); };
$("lang").onchange = async e => { closeSheet(); cfg.lang = e.target.value; LS.set("cfg", cfg); await open(); };

async function open() {
  $("main").innerHTML = '<div class="card"><div class="sent">Loading…</div></div>';
  try { deck = await loadDeck(cfg.lang); }
  catch { $("main").innerHTML = '<div class="card"><div class="sent">Couldn\'t load the sentences – check the connection.</div></div>'; return; }
  renderStats(); startRound();
}

// A link like …/cloze/#lang=cym opens straight into that language (Dune's Learn hub uses this).
const hl = new URLSearchParams(location.hash.slice(1)).get("lang");
if (hl && ["pol", "cym", "deu", "nob"].includes(hl)) cfg.lang = hl;
$("lang").value = cfg.lang;
if (!SR && cfg.mode === "speak") cfg.mode = "choice";
$("mSpeak").hidden = !SR;
$("mChoice").classList.toggle("on", cfg.mode === "choice"); $("mType").classList.toggle("on", cfg.mode === "type"); $("mSpeak").classList.toggle("on", cfg.mode === "speak"); $("mListen").classList.toggle("on", cfg.listen);
speechSynthesis?.getVoices?.();
open();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
